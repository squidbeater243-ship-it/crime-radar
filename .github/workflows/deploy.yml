name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Using `npm install` rather than `npm ci` here: this lockfile is
      # generated on Windows, and `npm ci`'s stricter platform check has a
      # known bug (EBADPLATFORM) where it incorrectly errors on unrelated
      # optional platform packages (e.g. esbuild's netbsd-arm64 build) when
      # installed on a different OS, instead of just skipping them.
      - run: npm install

      - run: npm run lint

      - run: npm test

      # Needed for the prerender step in `npm run build`, which crawls the
      # built site with headless Chromium to generate static HTML snapshots.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (sitemap + vite build + prerender)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=crime-radar
